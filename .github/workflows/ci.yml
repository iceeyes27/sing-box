name: CI

on:
  push:
  pull_request:

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Build installer
        run: bash scripts/build-install.sh

      - name: Verify install.sh is in sync with src/
        run: git diff --exit-code -- install.sh

      - name: Run tests
        run: bash scripts/test.sh

      - name: Run ShellCheck
        run: bash scripts/lint.sh

      - name: Verify checksum matches install.sh
        run: |
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 -c dist/install.sh.sha256
          else
            sha256sum -c dist/install.sh.sha256
          fi

  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debian-12
            image: debian:12
            prepare: apt-get update && apt-get install -y bash curl openssl ca-certificates procps
          - name: ubuntu-24.04
            image: ubuntu:24.04
            prepare: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y bash curl openssl ca-certificates procps
          - name: fedora-latest
            image: fedora:latest
            prepare: dnf install -y bash curl openssl ca-certificates procps-ng hostname
          - name: alpine-latest
            image: alpine:latest
            prepare: apk add --no-cache bash curl openssl ca-certificates procps
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Prepare container
        run: ${{ matrix.prepare }}

      - name: Checkout
        uses: actions/checkout@v4

      - name: Run smoke checks
        run: bash scripts/smoke.sh

      - name: Run syntax checks
        run: SBM_SKIP_REGRESSION=1 bash scripts/test.sh
